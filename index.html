<script type="module">
  // ─────────────────────────────────────────────────────────────
  //  ⚠️  SOSTITUISCI QUESTI VALORI CON LA TUA CONFIGURAZIONE FIREBASE
  //      Vai su: https://console.firebase.google.com
  //      Progetto → Impostazioni → Le tue app → Web → Configurazione
  // ─────────────────────────────────────────────────────────────
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy,
    where,
    setDoc,
    getDoc,
    Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ══════════════════════════════════════════════════════
  //  CONFIGURAZIONE FIREBASE — MODIFICA QUI
  // ══════════════════════════════════════════════════════
  const firebaseConfig = {
  apiKey: "AIzaSyBlxrMo_o0IAu1r8o3bX4vYziyorZ9k-aw",
  authDomain: "cavagnola-mct.firebaseapp.com",
  projectId: "cavagnola-mct",
  storageBucket: "cavagnola-mct.firebasestorage.app",
  messagingSenderId: "361604589687",
  appId: "1:361604589687:web:9d5755bfbba312b2413e72"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // UID admin — metti qui il tuo UID Firebase dopo il primo login
  // Puoi trovarlo in Firebase Console → Authentication → Users
  const ADMIN_UID = "JyxdTgynV9cJihPWrKQzORBhM9m1";
  // ══════════════════════════════════════════════════════
  //  DATI CLASSI (identici all'originale)
  // ══════════════════════════════════════════════════════
  const dati = {
    Classe1: [
      { min: 135, max: 144, prezzo: 3,  cntrSC: 32 },
      { min: 145, max: 154, prezzo: 7,  cntrSC: 32 },
      { min: 155, max: 164, prezzo: 11, cntrSC: 32 },
      { min: 165, max: 174, prezzo: 20, cntrSC: 32 },
      { min: 175, max: 184, prezzo: 23, cntrSC: 32 },
      { min: 185, max: 194, prezzo: 27, cntrSC: 32 },
      { min: 195, max: 204, prezzo: 35, cntrSC: 32 },
      { min: 205, max: Infinity, prezzo: 42, cntrSC: 32 },
    ],
    Classe2: [
      { min: 125, max: 134, prezzo: 3,  cntrSC: 32 },
      { min: 135, max: 144, prezzo: 7,  cntrSC: 32 },
      { min: 145, max: 154, prezzo: 11, cntrSC: 32 },
      { min: 155, max: 164, prezzo: 20, cntrSC: 32 },
      { min: 165, max: 174, prezzo: 23, cntrSC: 32 },
      { min: 175, max: 184, prezzo: 27, cntrSC: 32 },
      { min: 185, max: 194, prezzo: 35, cntrSC: 32 },
      { min: 195, max: Infinity, prezzo: 42, cntrSC: 32 },
    ],
    Classe3: [
      { min: 110, max: 119, prezzo: 3,  cntrSC: 30 },
      { min: 120, max: 129, prezzo: 7,  cntrSC: 30 },
      { min: 130, max: 139, prezzo: 11, cntrSC: 30 },
      { min: 140, max: 149, prezzo: 20, cntrSC: 30 },
      { min: 150, max: 159, prezzo: 23, cntrSC: 30 },
      { min: 160, max: 169, prezzo: 27, cntrSC: 30 },
      { min: 170, max: 179, prezzo: 35, cntrSC: 30 },
      { min: 180, max: Infinity, prezzo: 42, cntrSC: 30 },
    ],
    Classe4: [
      { min: 100, max: 109, prezzo: 3,  cntrSC: 28 },
      { min: 110, max: 119, prezzo: 7,  cntrSC: 28 },
      { min: 120, max: 129, prezzo: 11, cntrSC: 28 },
      { min: 130, max: 139, prezzo: 20, cntrSC: 28 },
      { min: 140, max: 149, prezzo: 23, cntrSC: 28 },
      { min: 150, max: 159, prezzo: 27, cntrSC: 28 },
      { min: 160, max: 169, prezzo: 35, cntrSC: 28 },
      { min: 170, max: Infinity, prezzo: 42, cntrSC: 28 },
    ],
    ClasseGTW: [
      { min: 55,  max: 64,  prezzo: 3,  cntrSC: 32 },
      { min: 65,  max: 74,  prezzo: 7,  cntrSC: 32 },
      { min: 75,  max: 84,  prezzo: 11, cntrSC: 32 },
      { min: 85,  max: 94,  prezzo: 20, cntrSC: 32 },
      { min: 95,  max: 104, prezzo: 23, cntrSC: 32 },
      { min: 105, max: 114, prezzo: 27, cntrSC: 32 },
      { min: 115, max: 124, prezzo: 35, cntrSC: 32 },
      { min: 125, max: Infinity, prezzo: 42, cntrSC: 32 },
    ],
    ClasseRoRo: [
      { min: 43,  max: 52,  prezzo: 3,  cntrSC: 32 },
      { min: 53,  max: 62,  prezzo: 7,  cntrSC: 32 },
      { min: 63,  max: 72,  prezzo: 11, cntrSC: 32 },
      { min: 73,  max: 82,  prezzo: 20, cntrSC: 32 },
      { min: 83,  max: 92,  prezzo: 23, cntrSC: 32 },
      { min: 93,  max: 102, prezzo: 27, cntrSC: 32 },
      { min: 103, max: 112, prezzo: 35, cntrSC: 32 },
      { min: 113, max: Infinity, prezzo: 42, cntrSC: 32 },
    ],
  };

  // ══════════════════════════════════════════════════════
  //  STATO GLOBALE
  // ══════════════════════════════════════════════════════
  let currentUser = null;
  let isAdmin = false;

  // ══════════════════════════════════════════════════════
  //  UTILITY UI
  // ══════════════════════════════════════════════════════
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function showError(elId, msg) {
    const el = document.getElementById(elId);
    el.textContent = msg;
    el.classList.remove("hidden");
    setTimeout(() => el.classList.add("hidden"), 5000);
  }

  function openPanel(id) {
    document.getElementById("overlay").classList.add("active");
    document.getElementById(id).classList.add("open");
  }

  function closeAllPanels() {
    document.getElementById("overlay").classList.remove("active");
    document.querySelectorAll(".side-panel").forEach(p => p.classList.remove("open"));
  }

  function formatDate(ts) {
    if (!ts) return "—";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  // ══════════════════════════════════════════════════════
  //  AUTH — LOGIN / REGISTRAZIONE / LOGOUT
  // ══════════════════════════════════════════════════════
  document.getElementById("btn-login").addEventListener("click", async () => {
    const email = document.getElementById("login-email").value.trim();
    const pass  = document.getElementById("login-password").value;
    if (!email || !pass) return showError("login-error", "Compila tutti i campi.");
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      showError("login-error", tradurciErrore(e.code));
    }
  });

  document.getElementById("btn-register").addEventListener("click", async () => {
    const name  = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const pass  = document.getElementById("reg-password").value;
    if (!name || !email || !pass) return showError("register-error", "Compila tutti i campi.");
    if (pass.length < 6) return showError("register-error", "Password minimo 6 caratteri.");
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      // Salva profilo su Firestore
      await setDoc(doc(db, "users", cred.user.uid), {
        name,
        email,
        createdAt: Timestamp.now(),
        role: "user"
      });
    } catch (e) {
      showError("register-error", tradurciErrore(e.code));
    }
  });

  document.getElementById("btn-logout").addEventListener("click", async () => {
    await signOut(auth);
  });

  document.getElementById("btn-goto-register").addEventListener("click", () => showScreen("screen-register"));
  document.getElementById("btn-goto-login").addEventListener("click", () => showScreen("screen-login"));

  function tradurciErrore(code) {
    const map = {
      "auth/invalid-email": "Email non valida.",
      "auth/user-not-found": "Utente non trovato.",
      "auth/wrong-password": "Password errata.",
      "auth/email-already-in-use": "Email già registrata.",
      "auth/weak-password": "Password troppo debole.",
      "auth/invalid-credential": "Credenziali non valide.",
      "auth/too-many-requests": "Troppi tentativi. Riprova tra poco.",
    };
    return map[code] || "Errore: " + code;
  }

  // ══════════════════════════════════════════════════════
  //  AUTH STATE OBSERVER
  // ══════════════════════════════════════════════════════
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      isAdmin = (user.uid === ADMIN_UID);
      document.getElementById("header-username").textContent = user.displayName || user.email;
      document.getElementById("btn-admin").style.display = isAdmin ? "inline-flex" : "none";
      showScreen("screen-app");
    } else {
      currentUser = null;
      isAdmin = false;
      showScreen("screen-login");
    }
  });

  // ══════════════════════════════════════════════════════
  //  MAPPA PREMI TERRA
  // ══════════════════════════════════════════════════════
  const prezzoTerra = { 3: 2, 7: 5, 11: 8, 20: 15, 23: 18, 27: 21, 35: 27, 42: 32 };

  // ══════════════════════════════════════════════════════
  //  LOGICA CALCOLO
  // ══════════════════════════════════════════════════════
  const tipoSel = document.getElementById("tipo");
  const labelValore = document.getElementById("label-valore");
  const groupRitardo = document.getElementById("group-ritardo");

  tipoSel.addEventListener("change", () => {
    const isCntr = tipoSel.value === "cntrCR";
    labelValore.textContent = isCntr ? "Quanti cntr ha fatto la CR?" : "Inserisci il prezzo (€):";
    groupRitardo.style.display = isCntr ? "block" : "none";
  });

  document.getElementById("calcola").addEventListener("click", async () => {
    const classe      = document.getElementById("classe").value;
    const tipo        = document.getElementById("tipo").value;
    const valore      = Number(document.getElementById("valore").value);
    const ritardo     = Number(document.getElementById("ritardo").value);
    const mezzoTerra  = document.getElementById("mezzoTerra").value;
    const outputEl    = document.getElementById("output");
    const intervalli  = dati[classe];

    if (!intervalli || isNaN(valore) || document.getElementById("valore").value === "") {
      outputEl.textContent = "⚠️ Inserisci un valore valido.";
      outputEl.classList.remove("hidden", "output-success");
      outputEl.classList.add("output-error");
      return;
    }

    let testoRisultato = "";
    let ritardoMsg = "";
    let risultato = null;
    const etichetta = mezzoTerra === "terra" ? "Terra" : "Mezzo";

    if (tipo === "cntrCR") {
      ritardoMsg = ritardo > 0
        ? `\nRitardo: ${ritardo}h (-${ritardo * 10}%) → soglie abbassate del ${ritardo * 10}%`
        : "\nNessun ritardo applicato.";
      const fattore = ritardo > 0 ? (1 - 0.10 * ritardo) : 1;
      risultato = intervalli.find((el) => {
        const minR = Math.floor(el.min * fattore);
        const maxR = el.max === Infinity ? Infinity : Math.floor(el.max * fattore);
        return valore >= minR && valore <= maxR;
      });
      if (risultato) {
        const premioFinale = mezzoTerra === "terra" ? prezzoTerra[risultato.prezzo] : risultato.prezzo;
        testoRisultato = `✅ Cavagnola ${etichetta}: €${premioFinale} — Contenitori SC: ${risultato.cntrSC}` + ritardoMsg;
      } else {
        testoRisultato = "⚠️ Valore fuori intervallo per cntr CR." + ritardoMsg;
      }
    } else {
      risultato = intervalli.find((el) => valore === el.prezzo);
      if (risultato) {
        const premioFinale = mezzoTerra === "terra" ? prezzoTerra[risultato.prezzo] : risultato.prezzo;
        testoRisultato = `✅ cntr CR: da ${risultato.min} a ${risultato.max === Infinity ? 'oltre' : risultato.max} — Premio ${etichetta}: €${premioFinale} — SC: ${risultato.cntrSC}`;
      } else {
        testoRisultato = "⚠️ Prezzo non trovato tra gli intervalli.";
      }
    }

    outputEl.textContent = testoRisultato;
    outputEl.classList.remove("hidden");
    if (testoRisultato.startsWith("✅")) {
      outputEl.classList.add("output-success");
      outputEl.classList.remove("output-error");
    } else {
      outputEl.classList.add("output-error");
      outputEl.classList.remove("output-success");
    }

    // Salva su Firestore se c'è un risultato valido e utente loggato
    if (currentUser && risultato) {
      try {
        await addDoc(collection(db, "calcoli"), {
          uid: currentUser.uid,
          userName: currentUser.displayName || currentUser.email,
          classe,
          tipo,
          valore,
          mezzoTerra,
          ritardo: tipo === "cntrCR" ? ritardo : 0,
          risultato: testoRisultato.replace("✅ ", ""),
          timestamp: Timestamp.now()
        });
      } catch (e) {
        console.warn("Errore salvataggio storico:", e);
      }
    }
  });

  // ══════════════════════════════════════════════════════
  //  STORICO UTENTE
  // ══════════════════════════════════════════════════════
  document.getElementById("btn-storico").addEventListener("click", async () => {
    openPanel("panel-storico");
    const listEl = document.getElementById("storico-list");
    listEl.innerHTML = "<p class='empty-state'>Caricamento...</p>";

    try {
      const q = query(
        collection(db, "calcoli"),
        where("uid", "==", currentUser.uid),
        orderBy("timestamp", "desc")
      );
      const snap = await getDocs(q);
      if (snap.empty) {
        listEl.innerHTML = "<p class='empty-state'>Nessun calcolo ancora.</p>";
        return;
      }
      listEl.innerHTML = "";
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const card = document.createElement("div");
        card.className = "storico-card";
        card.innerHTML = `
          <div class="storico-date">${formatDate(d.timestamp)}</div>
          <div class="storico-classe">${d.classe} · ${d.tipo === "cntrCR" ? "cntr CR" : "Prezzo"}</div>
          <div class="storico-valore">Input: ${d.valore}${d.ritardo > 0 ? ` · Ritardo: ${d.ritardo}h` : ""}</div>
          <div class="storico-risultato">${d.risultato}</div>
          <button class="btn-del-item" data-id="${docSnap.id}">🗑</button>
        `;
        listEl.appendChild(card);
      });

      // Gestione eliminazione singola voce
      listEl.querySelectorAll(".btn-del-item").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const id = e.currentTarget.dataset.id;
          await deleteDoc(doc(db, "calcoli", id));
          e.currentTarget.closest(".storico-card").remove();
          if (!listEl.querySelector(".storico-card")) {
            listEl.innerHTML = "<p class='empty-state'>Nessun calcolo ancora.</p>";
          }
        });
      });
    } catch (e) {
      listEl.innerHTML = `<p class='empty-state'>Errore: ${e.message}</p>`;
    }
  });

  document.getElementById("btn-clear-storico").addEventListener("click", async () => {
    if (!confirm("Cancellare tutto lo storico?")) return;
    try {
      const q = query(collection(db, "calcoli"), where("uid", "==", currentUser.uid));
      const snap = await getDocs(q);
      const deletes = snap.docs.map(d => deleteDoc(doc(db, "calcoli", d.id)));
      await Promise.all(deletes);
      document.getElementById("storico-list").innerHTML = "<p class='empty-state'>Storico cancellato.</p>";
    } catch (e) {
      alert("Errore durante la cancellazione.");
    }
  });

  // ══════════════════════════════════════════════════════
  //  ADMIN PANEL
  // ══════════════════════════════════════════════════════
  document.getElementById("btn-admin").addEventListener("click", async () => {
    if (!isAdmin) return;
    openPanel("panel-admin");
    const contentEl = document.getElementById("admin-content");
    contentEl.innerHTML = "<p class='empty-state'>Caricamento dati...</p>";

    try {
      // Carica tutti i calcoli
      const qCalcoli = query(collection(db, "calcoli"), orderBy("timestamp", "desc"));
      const snapCalcoli = await getDocs(qCalcoli);

      // Carica tutti gli utenti
      const snapUsers = await getDocs(collection(db, "users"));
      const usersMap = {};
      snapUsers.forEach(d => { usersMap[d.id] = d.data(); });

      if (snapCalcoli.empty) {
        contentEl.innerHTML = "<p class='empty-state'>Nessun dato presente.</p>";
        return;
      }

      // Raggruppa per utente
      const byUser = {};
      snapCalcoli.forEach(docSnap => {
        const d = docSnap.data();
        if (!byUser[d.uid]) byUser[d.uid] = { name: d.userName, calcoli: [] };
        byUser[d.uid].calcoli.push(d);
      });

      contentEl.innerHTML = `<div class="admin-summary">👥 Utenti: ${Object.keys(usersMap).length} | 🧮 Calcoli totali: ${snapCalcoli.size}</div>`;

      Object.entries(byUser).forEach(([uid, data]) => {
        const section = document.createElement("div");
        section.className = "admin-user-block";
        const isCurrentAdmin = uid === ADMIN_UID;
        section.innerHTML = `
          <div class="admin-user-header">
            ${isCurrentAdmin ? "🛡️ " : "👤 "}
            <strong>${data.name}</strong>
            <span class="admin-count">${data.calcoli.length} calcoli</span>
          </div>
        `;
        data.calcoli.slice(0, 5).forEach(c => {
          const row = document.createElement("div");
          row.className = "admin-calc-row";
          row.innerHTML = `
            <span class="admin-date">${formatDate(c.timestamp)}</span>
            <span class="admin-classe">${c.classe}</span>
            <span class="admin-res">${c.risultato}</span>
          `;
          section.appendChild(row);
        });
        if (data.calcoli.length > 5) {
          const more = document.createElement("p");
          more.className = "admin-more";
          more.textContent = `+ altri ${data.calcoli.length - 5} calcoli`;
          section.appendChild(more);
        }
        contentEl.appendChild(section);
      });
    } catch (e) {
      contentEl.innerHTML = `<p class='empty-state'>Errore: ${e.message}</p>`;
    }
  });

  // ══════════════════════════════════════════════════════
  //  OVERLAY & CHIUSURA PANNELLI
  // ══════════════════════════════════════════════════════
  document.getElementById("overlay").addEventListener("click", closeAllPanels);
  document.getElementById("btn-close-storico").addEventListener("click", closeAllPanels);
  document.getElementById("btn-close-admin").addEventListener("click", closeAllPanels);

  // ══════════════════════════════════════════════════════
  //  SERVICE WORKER REGISTRATION
  // ══════════════════════════════════════════════════════
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("Service Worker registrato ✓"))
      .catch(e => console.warn("SW error:", e));
  }
</script>

</body>
</html>
